<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress Vite HMR / WebSocket connection errors in preview environments
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? String(e.message) : '';
        var file = (e && e.filename) ? String(e.filename) : '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('ws:') ||
          msg.includes('wss:') ||
          msg.includes('moduleRunnerTransport') ||
          file.includes('@vite/client')
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
        if (
          reason.includes('WebSocket') ||
          reason.includes('ws:') ||
          reason.includes('wss:') ||
          reason.includes('moduleRunnerTransport') ||
          reason.includes('@vite/client')
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <title>RadarTG - Радар Тревог &amp; Бот-Парсер</title>
    <meta name="description" content="Полноценный Telegram бот и радар тревог с веб-интерфейсом: автоматический парсинг, умная фильтрация рекламы, ссылок, донатов и спама, AI-анализ угроз и ретрансляция в каналы." />
    <meta property="og:title" content="RadarTG - Радар Тревог &amp; Бот-Парсер" />
    <meta property="og:description" content="Полноценный Telegram бот и радар тревог с веб-интерфейсом: автоматический парсинг, умная фильтрация рекламы, ссылок, донатов и спама, AI-анализ угроз и ретрансляция в каналы." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
